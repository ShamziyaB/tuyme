<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img">
  <!-- Background: dark night blue -->
  <rect width="512" height="512" rx="110" fill="#0A1F4A"/>
  <!-- subtle glow -->
  <circle cx="256" cy="180" r="200" fill="white" opacity="0.04"/>
  <!-- tiny stars dots -->
  <g fill="white" opacity="0.95">
    <circle cx="34" cy="38" r="7"/><circle cx="134" cy="52" r="9"/><circle cx="338" cy="88" r="9"/>
    <circle cx="410" cy="150" r="6"/><circle cx="490" cy="88" r="6"/><circle cx="478" cy="170" r="5"/>
    <circle cx="36" cy="200" r="7"/><circle cx="148" cy="178" r="6"/><circle cx="32" cy="320" r="6"/>
    <circle cx="486" cy="350" r="6"/><circle cx="490" cy="430" r="5"/><circle cx="430" cy="480" r="6"/>
    <circle cx="56" cy="480" r="6"/><circle cx="204" cy="410" r="7"/><circle cx="320" cy="490" r="6"/>
  </g>
  <g fill="#FFD84D" opacity="0.95">
    <circle cx="168" cy="108" r="5"/><circle cx="370" cy="52" r="4"/><circle cx="492" cy="250" r="6"/>
    <circle cx="20" cy="380" r="4"/><circle cx="492" cy="292" r="5"/>
  </g>
  <!-- top-left star character -->
  <g transform="translate(64,58)">
    <path d="M 58 0 L 72 38 L 112 42 L 82 66 L 91 106 L 58 84 L 25 106 L 34 66 L 4 42 L 44 38 Z" fill="#FFD84D" stroke="#FFC93C" stroke-width="3" stroke-linejoin="round"/>
    <!-- glow -->
    <ellipse cx="58" cy="54" rx="58" ry="48" fill="#FFD84D" opacity="0.18" />
    <!-- face -->
    <circle cx="38" cy="56" r="9" fill="#0A1F4A"/><circle cx="40" cy="54" r="3" fill="white"/>
    <circle cx="78" cy="52" r="9" fill="#0A1F4A"/><circle cx="80" cy="50" r="3" fill="white"/>
    <circle cx="30" cy="72" r="9" fill="#FF8FA3" opacity="0.95"/>
    <circle cx="86" cy="68" r="9" fill="#FF8FA3" opacity="0.95"/>
    <path d="M 42 76 Q 58 94 74 74 Q 58 86 42 76" fill="#0A1F4A"/>
    <path d="M 52 84 Q 58 90 64 84" fill="#FF4D6A"/>
  </g>
  <!-- top-right moon -->
  <g transform="translate(346,66)">
    <circle cx="68" cy="68" r="66" fill="#FFD84D" stroke="#FFC93C" stroke-width="3"/>
    <ellipse cx="68" cy="68" rx="66" ry="66" fill="none" stroke="#FFD84D" stroke-width="0"/>
    <circle cx="68" cy="70" r="66" fill="url(#moonGrad)" opacity="0.35"/>
    <defs><radialGradient id="moonGrad" cx="40%" cy="30%"><stop offset="0%" stop-color="white" stop-opacity="0.5"/><stop offset="100%" stop-color="transparent"/></radialGradient></defs>
    <circle cx="40" cy="60" r="10" fill="#0A1F4A"/><circle cx="42" cy="58" r="3.2" fill="white"/>
    <circle cx="86" cy="66" r="10" fill="#0A1F4A"/><circle cx="88" cy="64" r="3.2" fill="white"/>
    <circle cx="32" cy="80" r="9" fill="#FF8FA3"/>
    <circle cx="98" cy="88" r="9" fill="#FF8FA3" opacity="0.95"/>
    <path d="M 44 86 Q 64 110 84 88 Q 64 104 44 86" fill="#0A1F4A"/>
    <path d="M 60 98 Q 66 104 72 98" fill="#FF4D6A"/>
  </g>
  <!-- small light stars -->
  <g fill="#8EC8FF" stroke="#60B0FF" stroke-width="2" stroke-linejoin="round" opacity="0.95">
    <path d="M 296 58 L 304 72 L 320 74 L 308 84 L 311 100 L 296 91 L 281 100 L 284 84 L 272 74 L 288 72 Z"/>
    <path d="M 304 390 L 310 400 L 322 402 L 313 410 L 315 422 L 304 415 L 293 422 L 295 410 L 286 402 L 298 400 Z"/>
  </g>
  <g fill="#FFD84D" stroke="#FFC93C" stroke-width="1.8" stroke-linejoin="round">
    <path d="M 178 148 L 182 156 L 190 157 L 184 162 L 185 170 L 178 166 L 171 170 L 172 162 L 166 157 L 174 156 Z"/>
    <path d="M 420 430 L 432 446 L 450 448 L 438 460 L 441 478 L 420 468 L 399 478 L 402 460 L 390 448 L 408 446 Z"/>
    <path d="M 276 478 L 281 486 L 290 487 L 284 493 L 285 502 L 276 497 L 267 502 L 268 493 L 262 487 L 271 486 Z"/>
    <path d="M 24 380 L 30 388 L 40 389 L 32 395 L 34 405 L 24 399 L 14 405 L 16 395 L 8 389 L 18 388 Z"/>
  </g>
  <!-- bottom cloud -->
  <g transform="translate(40,352)">
    <ellipse cx="88" cy="72" rx="88" ry="56" fill="#B8DFFF"/>
    <ellipse cx="58" cy="42" rx="48" ry="44" fill="#B8DFFF"/>
    <ellipse cx="116" cy="38" rx="52" ry="46" fill="#B8DFFF"/>
    <ellipse cx="88" cy="32" rx="42" ry="36" fill="#C6E6FF"/>
    <!-- face -->
    <circle cx="54" cy="68" r="10" fill="#0A1F4A"/><circle cx="56" cy="66" r="3" fill="white"/>
    <circle cx="106" cy="62" r="10" fill="#0A1F4A"/><circle cx="108" cy="60" r="3" fill="white"/>
    <circle cx="34" cy="84" r="10" fill="#FF8FA3"/>
    <circle cx="124" cy="76" r="10" fill="#FF8FA3" opacity="0.9"/>
    <path d="M 62 86 Q 84 106 106 84" fill="none" stroke="#0A1F4A" stroke-width="5" stroke-linecap="round"/>
  </g>
  <!-- Main letters АәБ -->
  <g font-family="'Baloo 2','Nunito',sans-serif" font-weight="800" text-anchor="middle">
    <!-- glow behind letters -->
    <text x="152" y="368" font-size="210" fill="white" opacity="0.18" style="filter:blur(8px)">А</text>
    <text x="262" y="368" font-size="210" fill="#FFD84D" opacity="0.28" style="filter:blur(8px)">ә</text>
    <text x="378" y="368" font-size="210" fill="white" opacity="0.18" style="filter:blur(8px)">Б</text>
    <!-- actual letters -->
    <text x="152" y="368" font-size="200" fill="white" stroke="white" stroke-width="6" stroke-linejoin="round" paint-order="stroke">А</text>
    <text x="262" y="368" font-size="200" fill="#FFEC8A" stroke="#FFD84D" stroke-width="6" stroke-linejoin="round" paint-order="stroke">ә</text>
    <text x="378" y="368" font-size="200" fill="white" stroke="white" stroke-width="6" stroke-linejoin="round" paint-order="stroke">Б</text>
    <!-- inner fill on top for clean -->
    <text x="152" y="368" font-size="200" fill="white">А</text>
    <text x="262" y="368" font-size="200" fill="#FFEC8A">ә</text>
    <text x="378" y="368" font-size="200" fill="white">Б</text>
  </g>
</svg>
