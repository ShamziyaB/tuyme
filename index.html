<!DOCTYPE html>
<html lang="kk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Түйме — балаларға арналған пернетақта</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="favicon-16.png">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Nunito:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg1:#0B1B3A; --bg2:#132A5C;
    --coral:#FF6B5E; --sun:#FFC93C; --mint:#3FE0B0; --sky:#57B8FF; --pink:#FF6FB0;
    box-sizing:border-box;
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
  }
  *{box-sizing:border-box;}
  html,body{height:100%; margin:0; overflow:hidden; background:var(--bg1);}
  body{
    font-family:'Nunito', sans-serif;
    background:radial-gradient(ellipse at 50% 20%, var(--bg2), var(--bg1) 70%);
    color:#EAF1FF;
    touch-action:none;
    -webkit-user-select:none; user-select:none;
    display:flex; align-items:center; justify-content:center;
  }
  .stage{position:fixed; inset:0; overflow:hidden;}
  .intro{
    position:absolute; inset:0; display:flex; flex-direction:column;
    align-items:center; justify-content:center; text-align:center; padding:24px;
    gap:14px; transition:opacity .5s ease;
  }
  .intro h1{
    font-family:'Baloo 2', sans-serif; font-weight:800;
    font-size:clamp(28px, 6vw, 54px); margin:0;
    color:var(--sun);
    text-shadow:0 0 24px rgba(255,201,60,.35);
  }
  .intro p{
    font-size:clamp(15px, 2.6vw, 20px); color:#B9C7EA; max-width:480px; margin:0; line-height:1.5;
  }
  .intro .hint{
    margin-top:8px; font-family:'Baloo 2'; font-weight:700; font-size:clamp(16px,3vw,22px);
    color:#EAF1FF; padding:12px 26px; border-radius:999px;
    background:linear-gradient(135deg, var(--coral), var(--pink));
    box-shadow:0 8px 24px rgba(255,111,94,.35);
    animation:pulse 1.8s ease-in-out infinite;
  }
  @keyframes pulse{ 0%,100%{transform:scale(1)} 50%{transform:scale(1.05)} }
  .footer-note{
    position:absolute; bottom:calc(14px + env(safe-area-inset-bottom,0px));
    left:0; right:0; text-align:center; font-size:12px; color:#5C6B94;
  }
  .pop{
    position:absolute; font-family:'Baloo 2', sans-serif; font-weight:700;
    pointer-events:none; will-change:transform, opacity;
    animation:popIn 2900ms cubic-bezier(.2,.8,.3,1) forwards;
    text-shadow:0 4px 18px rgba(0,0,0,.35);
  }
  @keyframes popIn{
    0%{ transform:translate(-50%,-50%) scale(.2) rotate(var(--rot)); opacity:0; }
    7%{ transform:translate(-50%,-50%) scale(1.15) rotate(var(--rot)); opacity:1; }
    11%{ transform:translate(-50%,-50%) scale(1) rotate(var(--rot)); opacity:1; }
    72%{ transform:translate(-50%,-50%) scale(1) rotate(var(--rot)); opacity:1; }
    100%{ transform:translate(-50%, calc(-50% - 26px)) scale(.94) rotate(var(--rot)); opacity:0; }
  }
  @media (prefers-reduced-motion: reduce){
    .pop{ animation-duration:3200ms; }
    .snow-layer, .falling-snow{ display:none; }
  }
  .counter{
    position:absolute; top:calc(58px + env(safe-area-inset-top,0px)); right:16px;
    font-size:13px; color:#4A5B8C; font-family:'Nunito';
    z-index:3;
  }
  .mode-switch{
    position:absolute; top:calc(14px + env(safe-area-inset-top,0px)); right:16px;
    z-index:4; display:flex; gap:4px;
    background:rgba(11,27,58,0.85); border:1px solid rgba(255,255,255,0.14);
    border-radius:999px; padding:4px; backdrop-filter:blur(10px);
    -webkit-backdrop-filter:blur(10px);
    box-shadow:0 4px 16px rgba(0,0,0,0.25);
  }
  .mode-btn{
    font-family:'Baloo 2', sans-serif; font-weight:700; font-size:13px;
    padding:7px 14px; border-radius:999px; border:none; cursor:pointer;
    background:transparent; color:#B9C7EA;
    transition:all .2s ease; display:flex; align-items:center; gap:6px;
    -webkit-tap-highlight-color:transparent; line-height:1;
  }
  .mode-btn.active{
    background:linear-gradient(135deg, #FFC93C, #FF8A3C);
    color:#0B1B3A; box-shadow:0 2px 10px rgba(255,201,60,.40);
  }
  .mode-btn:active{ transform:scale(0.96); }
  .mode-btn .mode-icon{ font-size:15px; }
  /* — Новогодняя деревня — */
  .winter-bg{
    position:absolute; inset:0; z-index:0; pointer-events:none; overflow:hidden;
  }
  .winter-bg .sky-glow{
    position:absolute; inset:0;
    background:
      radial-gradient(ellipse at 50% 8%, rgba(255,255,255,0.09) 0%, transparent 55%),
      radial-gradient(ellipse at 18% 18%, rgba(159,183,255,0.18) 0%, transparent 42%),
      radial-gradient(ellipse at 82% 20%, rgba(255,201,60,0.10) 0%, transparent 38%);
  }
  .winter-bg .village{
    position:absolute; inset:0;
    display:block; width:100%; height:100%;
  }
  .village picture{ display:block; width:100%; height:100%; }
  .village img{ width:100%; height:100%; display:block; object-fit:cover; object-position:center bottom; }
  /* на очень узком телефоне держим домики внизу, звезды сверху */
  @media (max-width: 600px){
    .village img{ object-position:center 85%; }
  }
  .village svg{ width:100%; height:100%; display:block; }
  .snow-layer{
    position:absolute; inset:0; pointer-events:none; z-index:1;
    background-image:
      radial-gradient(2px 2px at 12% 18%, rgba(255,255,255,0.9) 50%, transparent 60%),
      radial-gradient(1.6px 1.6px at 28% 42%, rgba(255,255,255,0.85) 50%, transparent 60%),
      radial-gradient(1.3px 1.3px at 44% 12%, rgba(255,255,255,0.8) 50%, transparent 60%),
      radial-gradient(2px 2px at 62% 28%, rgba(255,255,255,0.9) 50%, transparent 60%),
      radial-gradient(1.4px 1.4px at 76% 52%, rgba(255,255,255,0.82) 50%, transparent 60%),
      radial-gradient(1.8px 1.8px at 88% 14%, rgba(255,255,255,0.88) 50%, transparent 60%),
      radial-gradient(1.2px 1.2px at 35% 68%, rgba(255,255,255,0.75) 50%, transparent 60%),
      radial-gradient(1.5px 1.5px at 52% 78%, rgba(255,255,255,0.78) 50%, transparent 60%);
    opacity:0.9;
    animation: snowTwinkle 4.5s ease-in-out infinite alternate;
  }
  @keyframes snowTwinkle{ 0%{opacity:0.7} 100%{opacity:1} }
  .falling-snow{
    position:absolute; inset:0; pointer-events:none; z-index:1; overflow:hidden;
  }
  .falling-snow span{
    position:absolute; top:-10px; color:#fff; font-size:10px; line-height:1;
    opacity:0.85; text-shadow:0 0 6px rgba(255,255,255,0.8);
    animation: fall linear infinite;
  }
  @keyframes fall{
    0%{ transform:translateY(-10px) translateX(0) rotate(0deg); opacity:0; }
    8%{ opacity:0.9; }
    92%{ opacity:0.9; }
    100%{ transform:translateY(105vh) translateX(18px) rotate(180deg); opacity:0; }
  }
  .unlock-btn{
    font-family:'Baloo 2', sans-serif; font-weight:800; font-size:17px;
    color:#0B1B3A; background:linear-gradient(135deg, #FFC93C, #FF8A3C);
    border:none; border-radius:999px; padding:13px 28px; cursor:pointer;
    box-shadow:0 8px 24px rgba(255,201,60,.45), 0 2px 0 rgba(0,0,0,.12);
    transition:transform .15s ease, box-shadow .15s ease, opacity .3s ease;
    -webkit-tap-highlight-color:transparent;
  }
  .unlock-btn:active{ transform:scale(0.96); }
  .unlock-btn.hidden{ opacity:0; pointer-events:none; transform:scale(0.95); }
  .sound-hint{
    font-size:11px; color:#7A8BC0; margin-top:4px; max-width:300px; line-height:1.4;
  }
  /* чтобы контент был над фоном */
  .stage > .intro{ z-index:2; }
  .pop{ z-index:4; }
</style>
</head>
<body>
  <div class="stage" id="stage">
    <!-- Зимний фон: домики с заснеженными крышами -->
    <div class="winter-bg" aria-hidden="true">
      <div class="sky-glow"></div>
            <div class="village">
        <picture>
          <source srcset="assets/village-bg-960.webp 960w, assets/village-bg.webp 1920w" type="image/webp" sizes="100vw">
          <source srcset="assets/village-bg-960.jpg 960w, assets/village-bg.jpg 1920w" type="image/jpeg" sizes="100vw">
          <img src="assets/village-bg.jpg" alt="Зимняя деревня" width="1920" height="1079" loading="eager" decoding="async" fetchpriority="high">
        </picture>
      </div>
      <div class="snow-layer"></div>
      <div class="falling-snow" id="fallingSnow" aria-hidden="true"></div>
    </div>
    <div class="intro" id="intro">
      <h1>Түйме</h1>
      <p>Кез келген пернені бас — экранда әріп пен смайлик билейді. Ешбір ақы, тіркеу және жарнама жоқ.</p>
      <button id="unlockBtn" class="unlock-btn" type="button">🔊 Дыбысты қосу</button>
      <div id="soundHint" class="sound-hint">Дыбыс жоқ па? Дыбысты қосып, телефонның бүйіріндегі дыбыс қосқышын тексеріңіз</div>
      <div class="hint">Пернетақтаны түрт! ⌨️</div>
    </div>
    <div class="mode-switch" id="modeSwitch" role="tablist" aria-label="Режим">
      <button class="mode-btn active" data-mode="letters" type="button" role="tab" aria-selected="true">АӘБ</button>
      <button class="mode-btn" data-mode="emoji" type="button" role="tab" aria-selected="false">😊</button>
    </div>
    <div class="counter" id="counter"></div>
  </div>

<script>
(function(){
  const stage = document.getElementById('stage');
  const intro = document.getElementById('intro');
  const counterEl = document.getElementById('counter');

  // Қазақ кириллица әліпбиі (42 әріп)
  const ALPHABET = "АӘБВГҒДЕЁЖЗИЙКҚЛМНҢОӨПРСТУҰҮФХҺЦЧШЩЪЫІЬЭЮЯ".split('');
  const EMOJI = ["🐱","🐶","🐻","🐸","🦊","🐵","🦁","🐨","🐼","⭐","🌈","🎈","🍎","🍓","🌸","🚀","🚗","⚽","🎵","☀️","💫","🦋","🐝","🐢","⛄","❄️","☃️","🎄","🎅","🤶","🎁","🎀","🧣","🧤","✨","🌟","🎉","🎊","🍪","🍬","🍭","🦌","🐧","🏠","🌨️","❤️","💖","🔔","🕯️","🌲","⛸️","🥳","🧸","🍊","🥨","🎂","🧁","🦄","🐰","🦝","🐹","🐳","🦋","🌙","☃️"];
  const COLORS = ["#FF6B5E","#FFC93C","#3FE0B0","#57B8FF","#FF6FB0","#9B7BFF"];

  // === Аудио-файлы букв из abc-kaz-sounds ===
  // Легко расширяется: просто докинь файл в папку abc-kaz-sounds и добавь строку сюда
  const LETTER_SOUNDS = {
    "А": "abc-kaz-sounds/ABC-A.m4a",
    "A": "abc-kaz-sounds/ABC-A.m4a",
    "Б": "abc-kaz-sounds/ABC-Б.m4a",
    "В": "abc-kaz-sounds/ABC-В.m4a",
    "Г": "abc-kaz-sounds/ABC-Г.m4a",
    "Д": "abc-kaz-sounds/ABC-D.m4a",
    "D": "abc-kaz-sounds/ABC-D.m4a",
    "Е": "abc-kaz-sounds/ABC-Е.m4a",
    "E": "abc-kaz-sounds/ABC-Е.m4a"
  };
  const audioCache = {};
  function preloadLetterSounds(){
    Object.entries(LETTER_SOUNDS).forEach(([k, url])=>{
      if (audioCache[k]) return;
      try{
        const a = new Audio();
        a.src = encodeURI(url);
        a.preload = 'auto';
        a.load();
        audioCache[k] = a;
      }catch(e){}
    });
  }
  // предзагрузка сразу (не блокирует рендер)
  preloadLetterSounds();

  // режим АБВ / Смайлы
  let mode = localStorage.getItem('tuyme_mode') || 'letters';

  function applyMode(m){
    mode = m;
    localStorage.setItem('tuyme_mode', m);
    document.querySelectorAll('.mode-btn').forEach(b=>{
      const a = b.dataset.mode === m;
      b.classList.toggle('active', a);
      b.setAttribute('aria-selected', a);
    });
  }
  // инициализация переключателя после загрузки DOM (script внизу - DOM уже есть)
  (function initModeSwitch(){
    applyMode(mode);
    document.querySelectorAll('.mode-btn').forEach(btn=>{
      btn.addEventListener('click', (e)=>{
        e.stopPropagation();
        applyMode(btn.dataset.mode);
        playBlip();
      });
      btn.addEventListener('pointerdown', e=> e.stopPropagation());
      btn.addEventListener('touchend', e=> { e.stopPropagation(); });
    });
  })();

  let taps = 0;
  let audioCtx = null;
  let audioUnlocked = false;

  function ensureAudio(){
    if (!audioCtx) {
      try {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      } catch(e) { return false; }
    }
    if (audioCtx.state === 'suspended') {
      // синхронный вызов - важно для iOS: должен быть в стеке жеста без await
      audioCtx.resume().catch(()=>{});
    }
    // iOS прогрев пустым буфером - один раз
    if (!audioUnlocked) {
      try {
        const buf = audioCtx.createBuffer(1, 1, 22050);
        const src = audioCtx.createBufferSource();
        src.buffer = buf;
        src.connect(audioCtx.destination);
        src.start(0);
        src.stop(0.01);
        audioUnlocked = true;
      } catch(e) {}
    }
    return true;
  }

  // Разблокировка по видимости страницы (после сворачивания)
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible' && audioCtx && audioCtx.state === 'suspended') {
      audioCtx.resume().catch(()=>{});
    }
  });

  // --- Балалық дауыс (Web Speech API) ---
  let bestVoice = null;
  function pickVoice(){
    const voices = speechSynthesis.getVoices();
    if (!voices.length) return null;
    return (
      voices.find(v => v.lang && v.lang.toLowerCase().startsWith('kk')) ||
      voices.find(v => v.lang && v.lang.toLowerCase().startsWith('ru') && /female|жен/i.test(v.name)) ||
      voices.find(v => v.lang && v.lang.toLowerCase().startsWith('ru')) ||
      voices.find(v => /female|samantha|zira|google.*female/i.test(v.name)) ||
      voices[0]
    );
  }
  if ('speechSynthesis' in window) {
    bestVoice = pickVoice();
    speechSynthesis.onvoiceschanged = () => { bestVoice = pickVoice(); };
  }

  function speakLetterFallback(char){
    if (!('speechSynthesis' in window)) return;
    try{ speechSynthesis.cancel(); }catch(e){}
    const utter = new SpeechSynthesisUtterance(char);
    if (bestVoice) { utter.voice = bestVoice; utter.lang = bestVoice.lang; }
    else { utter.lang = 'ru-RU'; }
    utter.pitch = 1.8;   // тәтті балалық дауыс үшін жоғары үн
    utter.rate = 0.85;
    utter.volume = 1;
    try{ speechSynthesis.speak(utter); }catch(e){}
  }

  function speakLetter(char){
    const up = (char || '').toString().toUpperCase();
    const url = LETTER_SOUNDS[up] || LETTER_SOUNDS[char];
    if (url) {
      // приоритет — реальный аудио-файл из abc-kaz-sounds
      let a = audioCache[up] || audioCache[char];
      if (!a) {
        try{
          a = new Audio(encodeURI(url));
          a.preload = 'auto';
          audioCache[up] = a;
        }catch(e){ return speakLetterFallback(char); }
      }
      try{
        a.currentTime = 0;
        const p = a.play();
        if (p && p.catch) p.catch(()=> speakLetterFallback(char));
        return;
      }catch(e){
        return speakLetterFallback(char);
      }
    }
    speakLetterFallback(char);
  }

  function playBlip(){
    const ok = ensureAudio();
    if (!ok || !audioCtx) return;
    try {
      const now = audioCtx.currentTime;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      const freq = 380 + Math.random() * 420;
      osc.type = 'sine';
      osc.frequency.setValueAtTime(freq, now);
      osc.frequency.exponentialRampToValueAtTime(freq * 1.6, now + 0.12);
      gain.gain.setValueAtTime(0.0001, now);
      gain.gain.exponentialRampToValueAtTime(0.18, now + 0.02);
      gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.28);
      osc.connect(gain).connect(audioCtx.destination);
      osc.start(now);
      osc.stop(now + 0.3);
      // если контекст еще suspended (iOS задержка), повторный resume
      if (audioCtx.state === 'suspended') audioCtx.resume().catch(()=>{});
    } catch(e) {}
  }

  function pick(arr){ return arr[Math.floor(Math.random() * arr.length)]; }

  function spawn(x, y, forcedChar){
    let useEmoji;
    if (forcedChar) useEmoji = false;
    else if (mode === 'emoji') useEmoji = true;
    else if (mode === 'letters') useEmoji = false;
    else useEmoji = Math.random() < 0.35;
    const el = document.createElement('div');
    el.className = 'pop';
    el.textContent = forcedChar ? forcedChar : (useEmoji ? pick(EMOJI) : pick(ALPHABET));
    const size = 46 + Math.random() * 70;
    el.style.left = x + 'px';
    el.style.top = y + 'px';
    el.style.fontSize = size + 'px';
    el.style.color = pick(COLORS);
    el.style.setProperty('--rot', (Math.random() * 30 - 15) + 'deg');
    stage.appendChild(el);
    el.addEventListener('animationend', () => el.remove());
    // страховка если вкладка в фоне — анимация может не закончиться
    setTimeout(() => { if (el.parentNode) el.remove(); }, 3200);

    taps++;
    counterEl.textContent = 'Түртілді: ' + taps;

    // для букв — озвучка файлом (speakLetter), blip только для рандомных тапов/эмодзи
    if (!forcedChar) playBlip();

    if (intro.style.display !== 'none') {
      intro.style.opacity = '0';
      setTimeout(() => { intro.style.display = 'none'; }, 500);
    }
  }

  function randomPos(){
    const margin = 60;
    return {
      x: margin + Math.random() * (window.innerWidth - margin * 2),
      y: margin + Math.random() * (window.innerHeight - margin * 2)
    };
  }

  window.addEventListener('keydown', (e) => {
    // Жүйелік әрекеттерге кедергі болмас үшін бас пернелерді өткіземіз
    if (e.ctrlKey || e.metaKey || e.altKey) return;
    if (e.key === 'F5' || e.key === 'F11' || e.key === 'F12' || e.key === 'Tab') return;
    e.preventDefault();
    ensureAudio();
    const p = randomPos();
    const isLetterOrDigit = /^[\p{L}\p{N}]$/u.test(e.key);
    if (isLetterOrDigit) {
      const ch = e.key.toUpperCase();
      spawn(p.x, p.y, ch);
      speakLetter(ch);
    } else {
      // бос орын, көрсеткілер, т.б. — жай ойнақы эффект (spawn() өз дыбысын ойнатады)
      spawn(p.x, p.y);
    }
  });

  // --- Кнопка разблокировки звука (для iOS/Chrome mobile) ---
  (function initUnlock(){
    const btn = document.getElementById('unlockBtn');
    const hint = document.getElementById('soundHint');
    if (!btn) return;
    // если уже разблокировали ранее - скрываем
    if (localStorage.getItem('tuyme_audio_unlocked') === '1') {
      btn.classList.add('hidden');
      if (hint) hint.style.display = 'none';
      setTimeout(()=>{ btn.style.display='none'; if(hint) hint.style.display='none'; }, 350);
    }
    btn.addEventListener('click', (e) => {
      e.stopPropagation();
      ensureAudio();
      preloadLetterSounds();
      // прогрев speechSynthesis на мобилке
      if ('speechSynthesis' in window) {
        try { speechSynthesis.getVoices(); } catch(e2){}
        try {
          const u = new SpeechSynthesisUtterance('');
          u.volume = 0; speechSynthesis.speak(u);
        } catch(e2){}
      }
      // прогрев аудио-файлов (важно для iOS — play в стеке жеста)
      Object.values(audioCache).forEach(a=>{
        try{
          const p=a.play();
          if(p && p.then){
            p.then(()=>{a.pause(); a.currentTime=0;}).catch(()=>{});
          }
        }catch(e2){}
      });
      localStorage.setItem('tuyme_audio_unlocked', '1');
      btn.classList.add('hidden');
      if (hint) hint.style.display = 'none';
      setTimeout(()=>{ btn.style.display='none'; }, 350);
      // демо-звук чтобы юзер понял что включилось - синхронно в жесте
      playBlip();
    });
    // также скрываем кнопку после первого успешного тапа
    window._hideUnlockIfRunning = () => {
      if (audioCtx) {
        localStorage.setItem('tuyme_audio_unlocked', '1');
        btn.classList.add('hidden');
        if (hint) hint.style.display = 'none';
        setTimeout(()=>{ btn.style.display='none'; if(hint) hint.style.display='none'; }, 350);
      }
    };
  })();

  let lastPointerTime = 0;
  function pointerSpawn(x, y){
    // защита от дубля pointerdown+touchstart/click
    const now = Date.now();
    if (now - lastPointerTime < 350) return;
    lastPointerTime = now;
    // синхронно - важно для мобилки: без await чтобы остаться в стеке жеста
    ensureAudio();
    spawn(x, y);
    if (window._hideUnlockIfRunning) window._hideUnlockIfRunning();
  }

  function handlePointer(e){
    if (e.target.closest && (e.target.closest('#unlockBtn') || e.target.closest('#modeSwitch'))) return;
    const x = e.clientX ?? (e.touches && e.touches[0]?.clientX) ?? (e.changedTouches && e.changedTouches[0]?.clientX);
    const y = e.clientY ?? (e.touches && e.touches[0]?.clientY) ?? (e.changedTouches && e.changedTouches[0]?.clientY);
    if (x==null || y==null) return;
    pointerSpawn(x, y);
  }
  stage.addEventListener('pointerdown', handlePointer);
  stage.addEventListener('touchend', (e) => {
    // iOS часто требует touchend для разблокировки
    if (e.cancelable) e.preventDefault();
    handlePointer(e);
  }, {passive:false});
  stage.addEventListener('click', handlePointer);

  // падающий снег — новогодний вайб (домики с крышами в снегу)
  (function initSnow(){
    const snowRoot = document.getElementById('fallingSnow');
    if(!snowRoot) return;
    if(window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    const flakes = ['❄','❅','❆','•'];
    const count = 22;
    for(let i=0;i<count;i++){
      const s = document.createElement('span');
      s.textContent = flakes[Math.floor(Math.random()*flakes.length)];
      s.style.left = (Math.random()*100) + '%';
      s.style.animationDuration = (6 + Math.random()*7) + 's';
      s.style.animationDelay = (Math.random()*8) + 's';
      s.style.fontSize = (8 + Math.random()*11) + 'px';
      s.style.opacity = (0.55 + Math.random()*0.45);
      snowRoot.appendChild(s);
    }
  })();
})();
</script>
</body>
</html>
